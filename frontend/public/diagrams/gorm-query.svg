<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <title>Preload 的查询次数</title>
  <desc>一次文章列表查询由 GORM 发出四条 SQL：主查询加分类、作者、标签三次预加载，查询次数固定为 4，不随文章条数增长。</desc>
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6980"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="#0d131e"/>

  <text x="30" y="36" fill="#e7ecf5" font-size="17" font-weight="600">Preload：1 条主查询 + 3 条预加载 = 恒定 4 条</text>
  <text x="30" y="58" fill="#98a5bb" font-size="13">文章列表要带分类、作者、标签，但文章有多少篇都不影响查询次数</text>

  <!-- Repository -->
  <rect x="30" y="96" width="180" height="86" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="46" y="122" fill="#e7ecf5" font-size="13.5" font-weight="600">Repository</text>
  <text x="46" y="142" fill="#98a5bb" font-size="11">List(filter)</text>
  <text x="46" y="162" fill="#5c6980" font-size="10.5" font-family="ui-monospace, Menlo, monospace">3 个 Preload</text>

  <path d="M210,139 L246,139" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ga)"/>

  <!-- SQL 面板 -->
  <rect x="248" y="82" width="430" height="262" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="266" y="108" fill="#e7ecf5" font-size="13" font-weight="600">GORM 实际发出的 SQL</text>

  <rect x="264" y="122" width="398" height="44" fill="#0b0f16" stroke="#2a3446" rx="5"/>
  <text x="276" y="140" fill="#f5b942" font-size="10.5" font-family="ui-monospace, Menlo, monospace">1 · SELECT ... FROM articles ... LIMIT 20</text>
  <text x="276" y="157" fill="#5c6980" font-size="10">主查询：过滤 + 排序 + 分页</text>

  <rect x="264" y="176" width="398" height="44" fill="#0b0f16" stroke="#2a3446" rx="5"/>
  <text x="276" y="194" fill="#98a5bb" font-size="10.5" font-family="ui-monospace, Menlo, monospace">2 · SELECT ... FROM categories WHERE id IN (…)</text>
  <text x="276" y="211" fill="#5c6980" font-size="10">Preload("Category")：一次取全部分类</text>

  <rect x="264" y="230" width="398" height="44" fill="#0b0f16" stroke="#2a3446" rx="5"/>
  <text x="276" y="248" fill="#98a5bb" font-size="10.5" font-family="ui-monospace, Menlo, monospace">3 · SELECT ... FROM users WHERE id IN (…)</text>
  <text x="276" y="265" fill="#5c6980" font-size="10">Preload("Author")：一次取全部作者</text>

  <rect x="264" y="284" width="398" height="44" fill="#0b0f16" stroke="#2a3446" rx="5"/>
  <text x="276" y="302" fill="#98a5bb" font-size="10.5" font-family="ui-monospace, Menlo, monospace">4 · SELECT ... tags JOIN article_tags ...</text>
  <text x="276" y="319" fill="#5c6980" font-size="10">Preload("Tags")：多对多，中间表自动 join</text>

  <path d="M678,213 L706,213" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ga)"/>

  <!-- 结果 -->
  <rect x="710" y="150" width="220" height="124" fill="#13211f" stroke="#58c7c0" stroke-width="1.5" rx="8"/>
  <text x="728" y="176" fill="#58c7c0" font-size="13.5" font-weight="600">组装后的结果</text>
  <text x="728" y="200" fill="#98a5bb" font-size="11.5">20 篇文章</text>
  <text x="728" y="220" fill="#98a5bb" font-size="11.5">每篇带 category</text>
  <text x="728" y="240" fill="#98a5bb" font-size="11.5">每篇带 author</text>
  <text x="728" y="260" fill="#98a5bb" font-size="11.5">每篇带 tags 数组</text>

  <!-- 对比 -->
  <rect x="30" y="368" width="900" height="58" fill="#0b0f16" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="50" y="392" fill="#f07575" font-size="12.5">N+1 写法：1 次列表 + 每篇 3 次关联 = 1 + 3N 次（20 篇就是 61 次）</text>
  <text x="50" y="414" fill="#58c7c0" font-size="12.5">Preload：1 + 3 = 4 次，与列表长度无关</text>

  <text x="30" y="452" fill="#98a5bb" font-size="13">Preload 是额外查询而不是 join —— 少了往返次数，多了随关联表变宽的风险，取舍要看数据量。</text>
</svg>
