<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6980"/>
    </marker>
    <style>
      .box { fill: #111826; stroke: #2a3446; stroke-width: 1.5; rx: 10; }
      .accent { stroke: #f5b942; }
      .title { fill: #e7ecf5; font-size: 17px; font-weight: 600; }
      .sub { fill: #98a5bb; font-size: 13px; }
      .mono { fill: #5c6980; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
      .line { stroke: #5c6980; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { fill: #f5b942; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
      .note { fill: #98a5bb; font-size: 13px; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="360" fill="#0d131e"/>

  <!-- 浏览器 -->
  <rect class="box" x="30" y="110" width="170" height="96"/>
  <text class="title" x="115" y="148" text-anchor="middle">浏览器</text>
  <text class="sub" x="115" y="172" text-anchor="middle">Vue 3 单页应用</text>
  <text class="mono" x="115" y="192" text-anchor="middle">SPA + Router</text>

  <!-- Nginx -->
  <rect class="box accent" x="270" y="80" width="200" height="156"/>
  <text class="title" x="370" y="118" text-anchor="middle">Nginx</text>
  <text class="sub" x="370" y="144" text-anchor="middle">:80 / :443</text>
  <text class="mono" x="370" y="170" text-anchor="middle">/ → dist/index.html</text>
  <text class="mono" x="370" y="190" text-anchor="middle">/api  → 反代 :8090</text>
  <text class="mono" x="370" y="210" text-anchor="middle">/uploads → 反代 :8090</text>

  <!-- Go -->
  <rect class="box" x="540" y="110" width="190" height="96"/>
  <text class="title" x="635" y="148" text-anchor="middle">Go 后端</text>
  <text class="sub" x="635" y="172" text-anchor="middle">Gin · GORM</text>
  <text class="mono" x="635" y="192" text-anchor="middle">127.0.0.1:8090</text>

  <!-- MySQL -->
  <rect class="box" x="800" y="110" width="150" height="96"/>
  <text class="title" x="875" y="148" text-anchor="middle">MySQL 8</text>
  <text class="sub" x="875" y="172" text-anchor="middle">6 张表</text>
  <text class="mono" x="875" y="192" text-anchor="middle">utf8mb4</text>

  <!-- 箭头 -->
  <path class="line" d="M200,158 L268,158"/>
  <path class="line" d="M470,158 L538,158"/>
  <path class="line" d="M730,158 L798,158"/>

  <text class="label" x="234" y="148" text-anchor="middle">HTTP</text>
  <text class="label" x="504" y="148" text-anchor="middle">HTTP</text>
  <text class="label" x="764" y="148" text-anchor="middle">SQL</text>

  <!-- 静态文件说明 -->
  <path stroke="#2a3446" stroke-width="1.5" stroke-dasharray="4 4" fill="none" d="M370,236 L370,286"/>
  <rect class="box" x="250" y="286" width="240" height="46" fill="#0b0f16"/>
  <text class="mono" x="370" y="314" text-anchor="middle">/var/www/blog/dist</text>

  <text class="note" x="30" y="330">静态文件交给 Nginx，Go 只处理动态接口 —— 这是整套架构最重要的一条分工。</text>
</svg>
