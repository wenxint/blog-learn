<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <style>
      .tbl { fill: #111826; stroke: #2a3446; stroke-width: 1.5; rx: 8; }
      .tbl-a { stroke: #f5b942; }
      .tbl-c { stroke: #58c7c0; }
      .name { fill: #e7ecf5; font-size: 13px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
      .fld { fill: #98a5bb; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
      .pk { fill: #f5b942; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
      .rel { stroke: #5c6980; stroke-width: 1.5; fill: none; }
      .lbl { fill: #5c6980; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
      .note { fill: #98a5bb; font-size: 12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#0d131e"/>

  <!-- users -->
  <rect class="tbl" x="30" y="40" width="200" height="120"/>
  <text class="name" x="46" y="66">users</text>
  <text class="pk" x="46" y="88">id  (PK)</text>
  <text class="fld" x="46" y="106">username  (UK)</text>
  <text class="fld" x="46" y="124">password_hash</text>
  <text class="fld" x="46" y="142">role / status</text>

  <!-- categories -->
  <rect class="tbl" x="400" y="40" width="200" height="102"/>
  <text class="name" x="416" y="66">categories</text>
  <text class="pk" x="416" y="88">id  (PK)</text>
  <text class="fld" x="416" y="106">name / slug  (UK)</text>
  <text class="fld" x="416" y="124">sort</text>

  <!-- tags -->
  <rect class="tbl" x="770" y="40" width="200" height="102"/>
  <text class="name" x="786" y="66">tags</text>
  <text class="pk" x="786" y="88">id  (PK)</text>
  <text class="fld" x="786" y="106">name / slug  (UK)</text>

  <!-- articles -->
  <rect class="tbl tbl-a" x="330" y="230" width="340" height="150"/>
  <text class="name" x="346" y="258">articles</text>
  <text class="pk" x="346" y="280">id  (PK)</text>
  <text class="fld" x="346" y="298">title / summary / content</text>
  <text class="fld" x="346" y="316">status / is_top / view_count</text>
  <text class="fld" x="346" y="334">author_id → users.id</text>
  <text class="fld" x="346" y="352">category_id → categories.id</text>
  <text class="fld" x="346" y="370">deleted_at (软删除)</text>

  <!-- article_tags -->
  <rect class="tbl tbl-c" x="330" y="470" width="340" height="92"/>
  <text class="name" x="346" y="496">article_tags</text>
  <text class="pk" x="346" y="518">article_id + tag_id  (联合 PK)</text>
  <text class="fld" x="346" y="538">多对多的中间表，没有自增 id</text>

  <!-- comments -->
  <rect class="tbl" x="720" y="230" width="250" height="150"/>
  <text class="name" x="736" y="258">comments</text>
  <text class="pk" x="736" y="280">id  (PK)</text>
  <text class="fld" x="736" y="298">article_id → articles.id</text>
  <text class="fld" x="736" y="316">parent_id → comments.id</text>
  <text class="fld" x="736" y="334">nickname / email / content</text>
  <text class="fld" x="736" y="352">status (0 待审 / 1 通过)</text>
  <text class="fld" x="736" y="370">ip</text>

  <!-- 关系线 -->
  <path class="rel" d="M130,160 L130,305 L328,305"/>
  <text class="lbl" x="140" y="292">1 : N  author</text>

  <path class="rel" d="M500,142 L500,228"/>
  <text class="lbl" x="510" y="190">1 : N</text>

  <path class="rel" d="M870,142 L870,200 L679,200 L679,228"/>
  <text class="lbl" x="760" y="192">N : M 经 article_tags</text>

  <path class="rel" d="M670,305 L718,305"/>
  <text class="lbl" x="676" y="296">1 : N</text>

  <path class="rel" d="M500,380 L500,468"/>
  <text class="lbl" x="510" y="430">1 : N</text>

  <!-- comments 自关联 -->
  <path class="rel" d="M970,305 L985,305 L985,430 L860,430 L860,380"/>
  <text class="lbl" x="900" y="424">parent_id 自关联（两层）</text>

  <!-- 说明 -->
  <text class="note" x="30" y="600">关键索引：(status, published_at) —— 让「已发布 + 按时间倒序」既不回表排序也不全表扫描。</text>
  <text class="note" x="30" y="622">没有物理外键：关联完整性由 Service 保证，迁移和批量操作更灵活。</text>
</svg>
