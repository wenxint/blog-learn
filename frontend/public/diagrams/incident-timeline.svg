<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <title>上线当天按层排障的时间线</title>
  <desc>从 15:36 到 17:40，域名层先发现无 A 记录，16:26 通过 RDAP 确认 clientHold，17:10 解除、17:39 负缓存到期；期间网络层安全组未放行、应用层与编码问题也在并行处理。</desc>

  <rect x="0" y="0" width="960" height="520" fill="#0d131e"/>

  <text x="30" y="36" fill="#e7ecf5" font-size="17" font-weight="600">两小时上线：真正卡住的是域名状态</text>
  <text x="30" y="58" fill="#98a5bb" font-size="13">按层记录，每一行是一个排查层，不是一个操作步骤</text>

  <!-- 坐标轴 -->
  <line x1="170" y1="82" x2="920" y2="82" stroke="#2a3446" stroke-width="1.5"/>
  <text x="170" y="76" fill="#5c6980" font-size="10" font-family="ui-monospace, Menlo, monospace">15:30</text>
  <text x="337" y="76" fill="#5c6980" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">16:00</text>
  <text x="504" y="76" fill="#5c6980" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">16:30</text>
  <text x="670" y="76" fill="#5c6980" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">17:00</text>
  <text x="837" y="76" fill="#5c6980" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">17:30</text>
  <text x="920" y="76" fill="#5c6980" font-size="10" text-anchor="end" font-family="ui-monospace, Menlo, monospace">17:45</text>

  <!-- 层 1 -->
  <text x="30" y="118" fill="#e7ecf5" font-size="12.5" font-weight="600">域名 / DNS</text>
  <text x="30" y="135" fill="#5c6980" font-size="10">注册状态 · NS 委派</text>
  <line x1="170" y1="128" x2="920" y2="128" stroke="#2a3446" stroke-width="1.5"/>
  <circle cx="226" cy="128" r="5" fill="#f5b942"/>
  <text x="226" y="116" fill="#f5b942" font-size="10" text-anchor="middle">15:40 无 A 记录</text>
  <circle cx="481" cy="128" r="5" fill="#f07575"/>
  <text x="481" y="116" fill="#f07575" font-size="10" text-anchor="middle">16:26 RDAP：clientHold</text>
  <circle cx="725" cy="128" r="5" fill="#58c7c0"/>
  <text x="725" y="148" fill="#58c7c0" font-size="10" text-anchor="middle">17:10 解除</text>
  <circle cx="886" cy="128" r="5" fill="#58c7c0"/>
  <text x="886" y="116" fill="#58c7c0" font-size="10" text-anchor="middle">17:39 解析生效</text>

  <!-- 层 2 -->
  <text x="30" y="188" fill="#e7ecf5" font-size="12.5" font-weight="600">网络 / 安全组</text>
  <text x="30" y="205" fill="#5c6980" font-size="10">端口是否对外</text>
  <line x1="170" y1="198" x2="920" y2="198" stroke="#2a3446" stroke-width="1.5"/>
  <circle cx="831" cy="198" r="5" fill="#f07575"/>
  <text x="831" y="186" fill="#f07575" font-size="10" text-anchor="middle">17:29 外网不通</text>
  <circle cx="853" cy="198" r="5" fill="#58c7c0"/>
  <text x="853" y="218" fill="#58c7c0" font-size="10" text-anchor="middle">17:33 放行</text>

  <!-- 层 3 -->
  <text x="30" y="258" fill="#e7ecf5" font-size="12.5" font-weight="600">Nginx / 端口</text>
  <text x="30" y="275" fill="#5c6980" font-size="10">静态与反向代理</text>
  <line x1="170" y1="268" x2="920" y2="268" stroke="#2a3446" stroke-width="1.5"/>
  <circle cx="792" cy="268" r="5" fill="#98a5bb"/>
  <text x="792" y="256" fill="#98a5bb" font-size="10" text-anchor="middle">17:22 本机 200</text>
  <circle cx="892" cy="268" r="5" fill="#58c7c0"/>
  <text x="892" y="288" fill="#58c7c0" font-size="10" text-anchor="middle">17:40 外网 200</text>

  <!-- 层 4 -->
  <text x="30" y="328" fill="#e7ecf5" font-size="12.5" font-weight="600">Go 应用</text>
  <text x="30" y="345" fill="#5c6980" font-size="10">systemd 与二进制</text>
  <line x1="170" y1="338" x2="920" y2="338" stroke="#2a3446" stroke-width="1.5"/>
  <circle cx="780" cy="338" r="5" fill="#98a5bb"/>
  <text x="780" y="326" fill="#98a5bb" font-size="10" text-anchor="middle">17:19–17:21 部署并启动</text>

  <!-- 层 5 -->
  <text x="30" y="398" fill="#e7ecf5" font-size="12.5" font-weight="600">数据库 / 编码</text>
  <text x="30" y="415" fill="#5c6980" font-size="10">迁移与字符集</text>
  <line x1="170" y1="408" x2="920" y2="408" stroke="#2a3446" stroke-width="1.5"/>
  <circle cx="683" cy="408" r="5" fill="#f5b942"/>
  <text x="683" y="396" fill="#f5b942" font-size="10" text-anchor="middle">17:01–17:04 乱码 → 定位 → 重导</text>

  <!-- 根因标注 -->
  <rect x="330" y="152" width="330" height="30" fill="#1a1116" stroke="#f07575" stroke-width="1.2" rx="5"/>
  <text x="495" y="172" fill="#f07575" font-size="10.5" text-anchor="middle">根因不在应用：注册局没有发布 NS 委派</text>

  <text x="30" y="462" fill="#98a5bb" font-size="12.5">每层先用「不依赖下一层」的命令验证：dig 查域名、nc 查端口、curl 127.0.0.1 查 Nginx、curl 8090 查应用。</text>
  <text x="30" y="488" fill="#5c6980" font-size="11.5">那天先重启了两次服务，现场被破坏；如果先按层验证，15:40 就该停在域名层。</text>
</svg>
