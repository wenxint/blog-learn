<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <title>用布局做父路由的路由树</title>
  <desc>根路由下分三支：斜杠套 DefaultLayout，其下是首页、文章详情、归档、标签、关于；斜杠 admin 套 AdminLayout，其下是文章管理、编辑、评论审核；斜杠 admin 斜杠 login 不套布局。布局作为父路由后，页面组件只写内容区。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6980"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#0d131e"/>

  <text x="30" y="30" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace">router/index.js · createWebHistory()</text>

  <!-- 根 -->
  <rect x="330" y="46" width="300" height="56" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="480" y="70" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">Vue Router</text>
  <text x="480" y="90" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">history 模式，无 #</text>

  <!-- 分叉 -->
  <path d="M480,102 V126" stroke="#5c6980" stroke-width="1.5" fill="none"/>
  <path d="M200,126 H845" stroke="#5c6980" stroke-width="1.5" fill="none"/>
  <path d="M200,126 V146" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M540,126 V146" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M845,126 V146" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 前台布局 -->
  <rect x="90" y="150" width="220" height="78" fill="#111826" stroke="#f5b942" stroke-width="1.5" rx="10"/>
  <text x="200" y="176" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">DefaultLayout</text>
  <text x="200" y="196" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">path: /</text>
  <text x="200" y="214" font-size="11" fill="#98a5bb" text-anchor="middle">头部 + 内容区 + 页脚</text>

  <!-- 后台布局 -->
  <rect x="430" y="150" width="220" height="78" fill="#111826" stroke="#f5b942" stroke-width="1.5" rx="10"/>
  <text x="540" y="176" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">AdminLayout</text>
  <text x="540" y="196" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">path: /admin</text>
  <text x="540" y="214" font-size="11" fill="#98a5bb" text-anchor="middle">侧边栏 + 顶栏</text>

  <!-- 登录页 -->
  <rect x="740" y="150" width="210" height="78" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="845" y="176" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">Login</text>
  <text x="845" y="196" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">/admin/login</text>
  <text x="845" y="214" font-size="11" fill="#98a5bb" text-anchor="middle">不套布局，单独一屏</text>

  <!-- 前台子路由 -->
  <path d="M200,228 V240 H72 V497" stroke="#2a3446" stroke-width="1.5" fill="none"/>
  <path d="M72,273 H90 M72,329 H90 M72,385 H90 M72,441 H90 M72,497 H90" stroke="#2a3446" stroke-width="1.5" fill="none"/>

  <rect x="90" y="250" width="220" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="106" y="278" font-size="13" fill="#e7ecf5">首页</text>
  <text x="294" y="278" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/</text>

  <rect x="90" y="306" width="220" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="106" y="334" font-size="13" fill="#e7ecf5">文章详情</text>
  <text x="294" y="334" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/article/:id</text>

  <rect x="90" y="362" width="220" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="106" y="390" font-size="13" fill="#e7ecf5">归档</text>
  <text x="294" y="390" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/archive</text>

  <rect x="90" y="418" width="220" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="106" y="446" font-size="13" fill="#e7ecf5">标签</text>
  <text x="294" y="446" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/tags</text>

  <rect x="90" y="474" width="220" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="106" y="502" font-size="13" fill="#e7ecf5">关于</text>
  <text x="294" y="502" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/about</text>

  <!-- 后台子路由 -->
  <path d="M540,228 V240 H396 V385" stroke="#2a3446" stroke-width="1.5" fill="none"/>
  <path d="M396,273 H414 M396,329 H414 M396,385 H414" stroke="#2a3446" stroke-width="1.5" fill="none"/>

  <rect x="414" y="250" width="240" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="430" y="278" font-size="13" fill="#e7ecf5">文章管理</text>
  <text x="638" y="278" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/admin/articles</text>

  <rect x="414" y="306" width="240" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="430" y="334" font-size="13" fill="#e7ecf5">新建/编辑</text>
  <text x="638" y="334" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/admin/articles/new</text>

  <rect x="414" y="362" width="240" height="46" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="8"/>
  <text x="430" y="390" font-size="13" fill="#e7ecf5">评论审核</text>
  <text x="638" y="390" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="end">/admin/comments</text>

  <!-- 守卫说明 -->
  <rect x="414" y="424" width="516" height="70" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="430" y="450" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">meta.requiresAuth 只在 /admin 写一次，子路由全部继承</text>
  <text x="430" y="472" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">前端守卫只是体验，真正的鉴权在后端每个接口</text>

  <!-- 套壳说明 -->
  <rect x="30" y="528" width="390" height="44" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="46" y="548" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">页面组件里没有 header 和 footer</text>
  <text x="46" y="564" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">套壳发生在路由匹配这一层</text>

  <text x="30" y="590" font-size="13" fill="#98a5bb">布局当父路由后，页面只管内容区，套壳和鉴权都在路由里配一次。</text>
</svg>
