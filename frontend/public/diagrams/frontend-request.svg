<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <title>前端一次请求的往返路径</title>
  <desc>页面组件调用 api 模块，请求拦截器带上 token，经 Vite 代理或 Nginx 反代到达 Go 后端，响应拦截器剥掉 code/message/data 外壳后把 data 交给页面；401 在拦截器里清 token 并跳登录。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6980"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58c7c0"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f07575"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#0d131e"/>

  <text x="30" y="32" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace">GET /api/v1/articles 的完整往返</text>

  <!-- 第一行：页面 → api → 拦截器 → 代理 → 后端 -->
  <rect x="30" y="56" width="164" height="84" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="112" y="92" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">页面组件</text>
  <text x="112" y="116" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">Home.vue</text>
  <text x="112" y="136" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">ArticleDetail.vue</text>

  <rect x="214" y="56" width="164" height="84" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="296" y="92" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">api 模块</text>
  <text x="296" y="116" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">fetchArticles()</text>
  <text x="296" y="136" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">api/article.js</text>

  <rect x="398" y="56" width="164" height="84" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="480" y="92" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">请求拦截器</text>
  <text x="480" y="116" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">读 localStorage</text>
  <text x="480" y="136" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">Bearer token</text>

  <rect x="582" y="56" width="164" height="84" fill="#111826" stroke="#f5b942" stroke-width="1.5" rx="10"/>
  <text x="664" y="92" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">代理层</text>
  <text x="664" y="116" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">Vite proxy 8090</text>
  <text x="664" y="136" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">生产 Nginx 反代</text>

  <rect x="766" y="56" width="164" height="84" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="848" y="92" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">Go 后端</text>
  <text x="848" y="116" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">Gin + JSON</text>
  <text x="848" y="136" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">code message data</text>

  <path d="M196,98 H210" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M380,98 H394" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M564,98 H578" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M748,98 H762" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 后端 → 响应拦截器 -->
  <path d="M848,142 V226" stroke="#5c6980" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 第二行：响应拦截器 → 页面状态 -->
  <rect x="766" y="232" width="164" height="84" fill="#111826" stroke="#58c7c0" stroke-width="1.5" rx="10"/>
  <text x="848" y="268" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">响应拦截器</text>
  <text x="848" y="292" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">return body.data</text>
  <text x="848" y="312" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">code 非 0 也 reject</text>

  <path d="M764,274 H752" stroke="#58c7c0" stroke-width="1.5" fill="none" marker-end="url(#at)"/>

  <rect x="582" y="232" width="164" height="84" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="664" y="268" font-size="16" font-weight="600" fill="#e7ecf5" text-anchor="middle">页面状态</text>
  <text x="664" y="292" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">data.list / total</text>
  <text x="664" y="312" font-size="11" fill="#5c6980" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">loading / empty</text>

  <!-- 说明面板 -->
  <rect x="30" y="232" width="520" height="84" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="46" y="258" font-size="16" font-weight="600" fill="#e7ecf5">页面里为什么只剩成功分支</text>
  <text x="46" y="282" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">token 由请求拦截器统一带，外壳由响应拦截器统一剥</text>
  <text x="46" y="302" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">401 / 403 也在这里分好，页面没有第二处错误文案</text>

  <!-- 401 分支 -->
  <path d="M848,318 V386" stroke="#f07575" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <rect x="582" y="392" width="348" height="92" fill="#111826" stroke="#f07575" stroke-width="1.5" rx="10"/>
  <text x="598" y="418" font-size="16" font-weight="600" fill="#f07575">401 分支</text>
  <text x="598" y="442" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">清 localStorage 的 token、user</text>
  <text x="598" y="462" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">提示登录已过期，跳登录页</text>

  <!-- 两层失败 -->
  <rect x="30" y="392" width="520" height="92" fill="#111826" stroke="#2a3446" stroke-width="1.5" rx="10"/>
  <text x="46" y="418" font-size="16" font-weight="600" fill="#e7ecf5">两层失败：HTTP 状态码 + 业务 code</text>
  <text x="46" y="442" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">HTTP 401 未登录，HTTP 403 已登录但无权限</text>
  <text x="46" y="462" font-size="11" fill="#98a5bb" font-family="ui-monospace, Menlo, monospace">HTTP 200 加 code 10005，业务失败，同样 reject</text>

  <text x="30" y="530" font-size="13" fill="#98a5bb">页面里没有 axios、没有 /api/v1、也没有错误文案——重复只在拦截器里出现一次。</text>
</svg>
