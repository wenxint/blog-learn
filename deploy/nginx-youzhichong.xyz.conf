# youzhichong.xyz 生产环境 Nginx 配置
#
# 用法：
#   sudo cp deploy/nginx-youzhichong.xyz.conf /etc/nginx/conf.d/blog.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   1. 这个版本只监听 80，备案前后都能直接跑通。
#   2. 备案通过后执行 `sudo certbot --nginx -d youzhichong.xyz -d www.youzhichong.xyz`，
#      certbot 会自动改写本文件、加上 443 和 80→443 跳转，不需要手改。

server {
    listen 80;
    server_name youzhichong.xyz www.youzhichong.xyz;

    # 前端构建产物：cd frontend && pnpm build 生成的 dist
    root /var/www/blog/dist;
    index index.html;

    # 必须 >= 后端 UPLOAD_MAX_MB（默认 5MB），否则上传先被 Nginx 拒掉
    client_max_body_size 8m;
    client_body_buffer_size 1m;

    # 压缩：Go 不负责静态文件，这里补上
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 前端 SPA ----------
    # history 模式：/article/1 在磁盘上没有对应文件，必须回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物文件名带 hash，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不能缓存，否则发版后用户拿到旧页面
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API ----------
    # proxy_pass 结尾不带 /，保留 /api 前缀（后端路由就是 /api/v1/...）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 这三行让后端拿到真实客户端 IP。
        # 后端 .env 必须配 TRUSTED_PROXIES=127.0.0.1，否则评论 IP 全是 127.0.0.1，限流会误伤所有人。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---------- 上传的图片 ----------
    # 后端用 Gin Static 挂了 /uploads，直接反代最简单。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------- 其它 ----------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ~ /\. {
        deny all;
    }
}
