# 博客生产环境 Nginx 配置示例
#
# 放到 /etc/nginx/conf.d/blog.conf（或 sites-available/ 再软链）
# 改完执行：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name blog.example.com;   # 改成你的域名

    # 前端构建产物：cd frontend && pnpm build 生成的 dist
    root /var/www/blog/dist;
    index index.html;

    # 请求体上限，必须 >= 后端 UPLOAD_MAX_MB（默认 5MB），否则上传先被 Nginx 拒掉
    client_max_body_size 8m;

    # ---------- 前端 ----------
    # SPA 使用 history 模式：/article/1 这类路径在磁盘上没有对应文件，
    # 必须回退到 index.html，否则刷新页面 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物文件名带 hash，可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 这三行让后端能拿到真实客户端 IP。
        # 注意后端 .env 里必须配 TRUSTED_PROXIES=127.0.0.1，否则它不采信这些头。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------- 上传的图片 ----------
    # 后端已经用 Gin 的 Static 挂了 /uploads，直接反代最简单。
    # 流量大时改成 alias /var/www/blog/uploads/; 让 Nginx 直接发文件更快。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 大文件上传时 Nginx 默认会先把请求体写临时文件，这里调大一点
    client_body_buffer_size 1m;
}
